services:
  manager:
    build: .
    ports:
      # Host-side port only -- change the left-hand number if it collides
      # with something else already running on the Docker host.
      - "8088:3000"
    environment:
      PROJECTS_ROOT: /docker
      POLL_INTERVAL_MS: 15000
      OPERATION_TIMEOUT_MS: 600000
      HISTORY_LIMIT: 20
    volumes:
      # Host Docker engine access -- see spec.md's "Host Access Requirements".
      # This is root-equivalent on the host; only run on a trusted machine,
      # behind a private network / reverse-proxy auth.
      - /var/run/docker.sock:/var/run/docker.sock
      # Root project location scanned for */docker-compose.yml projects.
      - /docker:/docker
      # Reuses root's existing SSH key + known_hosts for projects whose git
      # remote is an SSH URL -- same credentials already used for manual
      # `git pull` on this host as root. Read-only, but note the container
      # can therefore use that key for anything, not just git.
      - /root/.ssh:/root/.ssh:ro
    restart: unless-stopped
